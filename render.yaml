databases:
  - name: zengineering-db
    plan: free
    databaseName: zengineering
    user: zengineering

services:
  - type: web
    name: zengineering-api
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zengineering-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://zengineering-app.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
