# ============================================================
# Zengineering V4.1 — Configuration Netlify (frontend only)
# Backend Express doit être déployé séparément (Railway, etc.)
# ============================================================

[build]
  base    = "frontend"
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA fallback (React Router) ───────────────────────────────
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
